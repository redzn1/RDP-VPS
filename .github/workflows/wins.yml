name: WinS 2025 RDP

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username untuk akun RDP'
        required: true
        default: 'Administrator'
      password:
        description: 'Password untuk akun RDP'
        required: true
        default: 'Redz132_'
      duration:
        description: 'Durasi RDP (jam) | Maksimal 6 jam | Kosongkan = 6 jam'
        required: false
        default: '6'
      tailscale_key:
        description: 'Tailscale Auth Key (kosongkan untuk pakai secret default)'
        required: false
        default: ''

jobs:
  winser-2025:
    runs-on: windows-2025
    timeout-minutes: 3600

    steps:
      - name: 1 Configure Core RDP Settings
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "       MENGONFIGURASI RDP & THEMES"
          Write-Host "=============================================="
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          Set-Service -Name Themes -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Themes -ErrorAction SilentlyContinue

          $tsPoliciesPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPoliciesPath)) { New-Item -Path $tsPoliciesPath -Force }
          Set-ItemProperty -Path $tsPoliciesPath -Name "fNoRemoteDesktopWallpaper" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fNoRemoteDesktopWallpaper" -Value 0 -Force

          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP & Themes siap."

      - name: 2 Setup User Accounts for RDP
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "      MENYIAPKAN AKUN RDP (2 USER)"
          Write-Host "=============================================="

          $password = "${{ github.event.inputs.password }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $adminUser = "${{ github.event.inputs.username }}"
          if (Get-LocalUser -Name $adminUser -ErrorAction SilentlyContinue) {
              Write-Host "Menghapus user $adminUser yang sudah ada..."
              Remove-LocalUser -Name $adminUser -ErrorAction Stop
          }
          New-LocalUser -Name $adminUser -Password $securePass -PasswordNeverExpires:$true
          Add-LocalGroupMember -Group "Administrators" -Member $adminUser -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $adminUser
          Set-LocalUser -Name $adminUser -PasswordNeverExpires:$true -AccountNeverExpires:$true
          Write-Host "$adminUser siap."

          $runnerUser = "runneradmin"
          Set-LocalUser -Name $runnerUser -Password $securePass -PasswordNeverExpires:$true -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $runnerUser -ErrorAction SilentlyContinue
          Write-Host "runneradmin password diupdate."
          Write-Host "Semua user menggunakan password yang sama."

      - name: 3 Set Custom Wallpaper and Lock Screen
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "   MENGATUR WALLPAPER & LOCK SCREEN"
          Write-Host "=============================================="
          $imageUrl = "https://images5.alphacoders.com/129/thumb-1920-1294333.png"
          $imagePath = "C:\Windows\Web\Wallpaper\custom_image.png"
          Invoke-WebRequest -Uri $imageUrl -OutFile $imagePath -UseBasicParsing

          $policyPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System"
          if (!(Test-Path $policyPath)) { New-Item -Path $policyPath -Force }
          Set-ItemProperty -Path $policyPath -Name "Wallpaper" -Value $imagePath -Force
          Set-ItemProperty -Path $policyPath -Name "WallpaperStyle" -Value "2" -Force

          $persPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization"
          if (!(Test-Path $persPath)) { New-Item -Path $persPath -Force }
          Set-ItemProperty -Path $persPath -Name "LockScreenImage" -Value $imagePath -Force

          Write-Host "Wallpaper & Lock Screen siap."

      - name: 4 Set Custom Profile Picture
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "     MENGATUR PROFILE PICTURE USER"
          Write-Host "=============================================="
          
          $profilePicUrl = "https://d.uguu.se/fkeWNWRb.jpeg"
          $profilePicPath = "$env:TEMP\profile_pic.jpg"
          $userPicDir = "C:\ProgramData\Microsoft\User Account Pictures"
          
          Write-Host "Mendownload profile picture..."
          try {
              Invoke-WebRequest -Uri $profilePicUrl -OutFile $profilePicPath -UseBasicParsing
              Write-Host "Profile picture berhasil didownload!"
          } catch {
              Write-Warning "Gagal download profile picture, melanjutkan..."
              exit 0
          }
          
          Write-Host "Mengganti profile picture untuk semua user..."
          
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user.png" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user-32.png" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user-40.png" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user-48.png" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user-192.png" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user.bmp" -Force
          Copy-Item -Path $profilePicPath -Destination "$userPicDir\user.jpg" -Force
          
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process explorer -ErrorAction SilentlyContinue
          
          Write-Host "Profile picture berhasil diganti!"

      - name: 5 Create Logon Startup Script
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "   MEMBUAT SCRIPT LOGON WALLPAPER"
          Write-Host "=============================================="
          $scriptPath = "C:\Windows\set_wallpaper.ps1"
          @'
          Start-Sleep -Seconds 3
          $imagePath = "C:\Windows\Web\Wallpaper\custom_image.png"
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "Wallpaper" -Value $imagePath -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "WallpaperStyle" -Value "2" -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name "TileWallpaper" -Value "0" -Force
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lvParam, int fuWinIni);
          }
          "@
          [Wallpaper]::SystemParametersInfo(20, 0, $imagePath, 3)
          $userDesktop = [Environment]::GetFolderPath("Desktop")
          if (Test-Path $userDesktop) {
              Get-ChildItem -Path $userDesktop -File | Where-Object {
                  $_.Extension -in @(".lnk", ".url") -and 
                  $_.Name -notlike "*Chrome*" -and 
                  $_.Name -notlike "*Edge*"
              } | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Stop-Process -Name explorer -Force
          '@ | Out-File -FilePath $scriptPath -Encoding utf8 -Force
          
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "SetCustomWallpaper" -Value "PowerShell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File C:\Windows\set_wallpaper.ps1" -Force
          Write-Host "Script logon terpasang."

      - name: 6 Clean Global Desktop Shortcuts
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "     MEMBERSIHKAN SHORTCUT PUBLIK"
          Write-Host "=============================================="
          $desktopPaths = @("C:\Users\Public\Desktop", "C:\Users\Default\Desktop")
          foreach ($path in $desktopPaths) {
              if (Test-Path $path) {
                  Get-ChildItem -Path $path -File | Where-Object {
                      $_.Extension -in @(".lnk", ".url") -and 
                      $_.Name -notlike "*Chrome*" -and 
                      $_.Name -notlike "*Edge*"
                  } | Remove-Item -Force -ErrorAction SilentlyContinue
              }
          }
          Write-Host "Desktop publik bersih."

      - name: 7 Install Tailscale
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "        MENGINSTALL TAILSCALE"
          Write-Host "=============================================="
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Start-Sleep -Seconds 5
          Write-Host "Tailscale terinstal."

      - name: 8 Tailscale Auth Key Login
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "     LOGIN TAILSCALE DENGAN AUTH KEY"
          Write-Host "=============================================="
          
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          $inputKey = "${{ github.event.inputs.tailscale_key }}"
          $secretKey = "${{ secrets.TS_WIN_KEY }}"
          
          if ($inputKey -ne '') {
              $authKey = $inputKey
              Write-Host "Menggunakan Auth Key dari input manual"
          } elseif ($secretKey -ne '') {
              $authKey = $secretKey
              Write-Host "Menggunakan Auth Key dari GitHub Secret"
          } else {
              Write-Error "Tailscale Auth Key tidak ditemukan!"
              exit 1
          }
          
          Write-Host "Mengautentikasi dengan Auth Key..."
          & $tsPath up --auth-key $authKey --hostname=wins-25-${{ github.run_number }} --accept-dns=false
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Gagal autentikasi dengan Auth Key."
              exit 1
          }
          
          Write-Host "Menunggu koneksi Tailscale stabil..."
          Start-Sleep -Seconds 10
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 36) {
              $tsIP = & $tsPath ip -4 2>$null
              if (-not $tsIP) {
                  Write-Host "Menunggu IP Tailscale... (percobaan $($retries+1)/36)"
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "Tidak bisa mendapatkan IP Tailscale."
              exit 1
          }
          
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Berhasil terhubung ke Tailscale!"
          Write-Host "IP Tailscale: $tsIP"

      - name: 9 Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "      MEMVERIFIKASI KONEKSI RDP"
          Write-Host "=============================================="
          $ip = $env:TAILSCALE_IP
          $testResult = Test-NetConnection -ComputerName $ip -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "Koneksi RDP internal gagal!"
              exit 1
          }
          Write-Host "Port 3389 terbuka, RDP siap."

      - name: 10 INFORMASI RDP DAN KIRIM TELEGRAM
        shell: pwsh
        run: |
          $ip = $env:TAILSCALE_IP
          $user = "${{ github.event.inputs.username }}"
          $pass = "${{ github.event.inputs.password }}"
          
          # Hitung durasi (maksimal 6 jam)
          $durasiInput = "${{ github.event.inputs.duration }}"
          if ($durasiInput -eq '' -or $durasiInput -eq '0') {
              $jam = 6
          } else {
              try {
                  $jam = [int]$durasiInput
                  if ($jam -lt 1) { $jam = 1 }
                  if ($jam -gt 6) { $jam = 6 }
              } catch {
                  $jam = 6
              }
          }
          $menit = $jam * 60
          
          # Tampilkan di log
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "              INFORMASI RDP"
          Write-Host "======================================================"
          Write-Host "  IP Tailscale : $ip"
          Write-Host "  User 1       : $user"
          Write-Host "  User 2       : runneradmin"
          Write-Host "  Password     : $pass"
          Write-Host "  Durasi       : $jam Jam ($menit Menit)"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "Hubungkan ke Remote Desktop Connection"
          Write-Host "Gunakan IP Tailscale di atas"
          Write-Host ""
          
          # Kirim ke Telegram
          $botToken = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          
          if ($botToken -ne '') {
              Write-Host "Mengirim info ke Telegram..."
              
              $message = "INFORMASI RDP WINDOWS SERVER 2025%0A%0A"
              $message += "IP Tailscale: $ip%0A"
              $message += "User 1: $user%0A"
              $message += "User 2: runneradmin%0A"
              $message += "Password: $pass%0A"
              $message += "Durasi: $jam Jam ($menit Menit)%0A%0A"
              $message += "Hubungkan ke RD Client"
              
              try {
                  $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/getUpdates" -Method Get
                  
                  if ($updates.ok -and $updates.result.Count -gt 0) {
                      $latestUpdate = $updates.result[-1]
                      $chatId = $latestUpdate.message.chat.id
                      
                      $sendUrl = "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$message"
                      Invoke-RestMethod -Uri $sendUrl -Method Get
                      Write-Host "Info RDP terkirim ke Telegram! (Chat ID: $chatId)"
                  } else {
                      Write-Warning "Tidak ada update dari bot. Kirim /start ke bot Telegram dulu."
                  }
              } catch {
                  Write-Warning "Gagal kirim ke Telegram: $_"
              }
          } else {
              Write-Host "TELEGRAM_BOT_TOKEN tidak ditemukan di Secrets"
          }

      - name: 11 MAINTAIN CONNECTION
        shell: pwsh
        run: |
          # Hitung durasi (maksimal 6 jam)
          $durasiInput = "${{ github.event.inputs.duration }}"
          if ($durasiInput -eq '' -or $durasiInput -eq '0') {
              $jam = 6
          } else {
              try {
                  $jam = [int]$durasiInput
                  if ($jam -lt 1) { $jam = 1 }
                  if ($jam -gt 6) { $jam = 6 }
              } catch {
                  $jam = 6
              }
          }
          $totalDetik = $jam * 3600
          
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "           MAINTAIN CONNECTION"
          Write-Host "        MENJAGA RDP TETAP AKTIF"
          Write-Host "======================================================"
          Write-Host ""
          Write-Host "RDP sedang berjalan..."
          Write-Host "Durasi: $jam Jam ($totalDetik detik)"
          Write-Host "Tekan Cancel untuk menghentikan"
          Write-Host ""
          
          $startTime = Get-Date
          $endTime = $startTime.AddSeconds($totalDetik)
          
          while ($true) {
              $currentTime = Get-Date
              $timeLeft = $endTime - $currentTime
              
              if ($timeLeft.TotalSeconds -le 0) {
                  Write-Host ""
                  Write-Host "======================================================"
                  Write-Host "     WAKTU HABIS - RDP DIMATIKAN"
                  Write-Host "======================================================"
                  Write-Host ""
                  
                  # Kirim notif ke Telegram
                  $botToken = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
                  if ($botToken -ne '') {
                      try {
                          $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/getUpdates" -Method Get
                          if ($updates.ok -and $updates.result.Count -gt 0) {
                              $chatId = $updates.result[-1].message.chat.id
                              $endMsg = "RDP Telah Mati%0A%0ADurasi $jam jam telah habis.%0AJalankan ulang untuk membuat sesi baru."
                              $endUrl = "https://api.telegram.org/bot$botToken/sendMessage?chat_id=$chatId&text=$endMsg"
                              Invoke-RestMethod -Uri $endUrl -Method Get
                          }
                      } catch {}
                  }
                  
                  break
              }
              
              $hours = [math]::Floor($timeLeft.TotalHours)
              $minutes = $timeLeft.Minutes
              $seconds = $timeLeft.Seconds
              
              Write-Host "[$($currentTime.ToString('HH:mm:ss'))] Aktif | Sisa: $hours jam $minutes menit $seconds detik"
              Start-Sleep -Seconds 300
          }
