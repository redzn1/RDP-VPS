name: Ubuntu Server CI (VPS Mode via Tailscale)

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: 'Password untuk root user'
        required: true
        default: 'redz'
        type: string
      tailscale_auth_key:
        description: 'Tailscale Auth Key (format: tskey-auth-xxxxx)'
        required: true
        type: string
      keep_alive_hours:
        description: 'Durasi VPS aktif (jam)'
        required: false
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '6'
          - '12'
          - '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440   # Maks 24 jam

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Ubuntu version
        run: |
          echo "=== Ubuntu Version ==="
          lsb_release -a
          echo "=== Kernel Info ==="
          uname -a

      - name: Update package list
        run: sudo apt-get update

      - name: Install tools (neofetch, sudo, nano, htop, openssh-server, curl, jq)
        run: sudo apt-get install -y neofetch sudo nano htop openssh-server curl jq

      - name: Show system info
        run: neofetch --stdout

      - name: Set hostname to cloudvpss
        run: |
          echo "Mengatur hostname ke cloudvpss..."
          sudo hostnamectl set-hostname cloudvpss
          
          # Update /etc/hosts agar hostname baru dikenali
          sudo sed -i "s/127.0.1.1.*/127.0.1.1 cloudvpss/" /etc/hosts
          
          # Jika baris 127.0.1.1 belum ada, tambahkan
          if ! grep -q "127.0.1.1" /etc/hosts; then
            echo "127.0.1.1 cloudvpss" | sudo tee -a /etc/hosts
          fi
          
          echo "✅ Hostname berhasil diubah menjadi: $(hostname)"

      - name: Change root password
        run: |
          echo "Mengganti password root..."
          echo "root:${{ github.event.inputs.root_password }}" | sudo chpasswd
          echo "✅ Password root berhasil diganti"

      - name: Configure SSH server
        run: |
          echo "Mengkonfigurasi SSH server..."
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#Port 22/Port 22/' /etc/ssh/sshd_config
          
          # Tambahkan konfigurasi untuk Tailscale
          echo "AllowUsers root" | sudo tee -a /etc/ssh/sshd_config
          
          sudo systemctl restart ssh
          echo "✅ SSH server dikonfigurasi dan direstart"
          sudo systemctl status ssh --no-pager

      - name: Install Tailscale
        run: |
          echo "Menginstall Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale terinstall"

      - name: Connect to Tailscale network
        run: |
          TS_AUTH_KEY="${{ github.event.inputs.tailscale_auth_key }}"
          
          if [ -z "$TS_AUTH_KEY" ]; then
            echo "❌ Tailscale Auth Key tidak boleh kosong!"
            exit 1
          fi
          
          echo "Menghubungkan ke Tailscale network..."
          sudo tailscale up --auth-key="${TS_AUTH_KEY}" --hostname="cloudvpss"
          
          # Tunggu koneksi Tailscale stabil
          sleep 5
          
          # Dapatkan IP Tailscale
          TS_IP=$(sudo tailscale ip -4)
          
          if [ -z "$TS_IP" ]; then
            echo "❌ Gagal mendapatkan IP Tailscale"
            sudo tailscale status
            exit 1
          fi
          
          echo "✅ Tailscale connected!"
          echo "Tailscale IP: ${TS_IP}"
          echo "TS_IP=${TS_IP}" >> $GITHUB_ENV
          
          # Tampilkan status Tailscale
          echo "=== Tailscale Status ==="
          sudo tailscale status

      - name: Get Tailscale IP and prepare connection info
        id: tailscale
        run: |
          # Pastikan Tailscale sudah connect
          TS_IP=$(sudo tailscale ip -4)
          
          if [ -z "$TS_IP" ]; then
            echo "❌ Tailscale IP tidak ditemukan"
            exit 1
          fi
          
          echo "TS_IP=${TS_IP}" >> $GITHUB_ENV
          
          echo "╔══════════════════════════════════════════╗"
          echo "║    🐧 UBUNTU SERVER                     ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          echo "🌍 IP Tailscale: ${TS_IP}"
          echo "👤 User: root"
          echo "🔑 Password: ${{ github.event.inputs.root_password }}"
          echo "⏱️ Durasi: ${{ github.event.inputs.keep_alive_hours }} jam"
          echo ""
          echo "========================================="
          echo "📅 Mulai: $(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
          echo "⏱️ Berakhir: $(TZ='Asia/Jakarta' date -d "+${{ github.event.inputs.keep_alive_hours }} hours" '+%Y-%m-%d %H:%M:%S WIB')"
          echo "========================================="
          echo ""
          echo "💻 SSH Command:"
          echo "ssh -o StrictHostKeyChecking=no root@${TS_IP}"

      - name: Test SSH connection
        run: |
          echo "Menguji koneksi SSH ke Tailscale IP..."
          
          # Tunggu SSH service siap
          sleep 5
          
          # Test SSH connection
          if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@${TS_IP} "echo 'SSH connection successful'" 2>/dev/null; then
            echo "✅ Koneksi SSH ke Tailscale IP berhasil!"
            CONNECTION_STATUS="success"
          else
            echo "⚠️ Koneksi SSH gagal, mencoba lagi dalam 10 detik..."
            sleep 10
            
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@${TS_IP} "echo 'SSH connection successful'" 2>/dev/null; then
              echo "✅ Koneksi SSH ke Tailscale IP berhasil!"
              CONNECTION_STATUS="success"
            else
              echo "❌ Koneksi SSH masih gagal"
              CONNECTION_STATUS="failed"
              
              # Cek status Tailscale dan SSH
              echo "=== Tailscale Status ==="
              sudo tailscale status
              echo "=== SSH Service Status ==="
              sudo systemctl status ssh --no-pager
            fi
          fi
          
          echo "CONNECTION_STATUS=${CONNECTION_STATUS}" >> $GITHUB_ENV

      - name: Send notification to WhatsApp via Fonnte
        if: success() && env.CONNECTION_STATUS == 'success'
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
        run: |
          if [ -z "$FONNTE_TOKEN" ] || [ -z "$WA_TARGET" ]; then
            echo "⚠️ FONNTE_TOKEN atau WA_TARGET tidak ditemukan di secrets!"
            echo "⚠️ Melewati pengiriman notifikasi WhatsApp"
            exit 0
          fi
          
          TS_IP="${TS_IP:-$(sudo tailscale ip -4)}"
          ROOT_PASS="${{ github.event.inputs.root_password }}"
          KEEP_ALIVE="${{ github.event.inputs.keep_alive_hours }}"
          START_TIME="$(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')"
          END_TIME="$(TZ='Asia/Jakarta' date -d "+${KEEP_ALIVE} hours" '+%Y-%m-%d %H:%M:%S WIB')"
          
          # Format pesan sesuai permintaan
          MESSAGE="╔══════════════════════════════╗
║    🐧 *UBUNTU SERVER*       ║
╚══════════════════════════════╝

🌍 IP Tailscale: ${TS_IP}
👤 User: root
🔑 Password: ${ROOT_PASS}
⏱️ Durasi: ${KEEP_ALIVE} jam

─────────────────────────────
📅 Mulai: ${START_TIME}
⏱️ Berakhir: ${END_TIME}
─────────────────────────────

💻 SSH Command:
ssh -o StrictHostKeyChecking=no root@${TS_IP}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⚠️ Jangan bagikan informasi ini ke siapapun!"
          
          # Kirim via Fonnte API
          echo "Mengirim notifikasi ke WhatsApp Grup via Fonnte..."
          echo "Target: ${WA_TARGET}"
          
          RESPONSE=$(curl -s -X POST "https://api.fonnte.com/send" \
            -H "Authorization: ${FONNTE_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "target=${WA_TARGET}" \
            -d "message=${MESSAGE}" \
            -d "countryCode=62" \
            -d "delay=2")
          
          # Cek response
          if echo "$RESPONSE" | grep -q '"status":true'; then
            echo "✅ Notifikasi WhatsApp berhasil dikirim ke grup"
            echo "📱 Target: ${WA_TARGET}"
          else
            echo "❌ Gagal mengirim notifikasi WhatsApp"
            echo "Response: $RESPONSE"
            echo ""
            echo "💡 Informasi VPS tetap bisa diakses:"
            echo "   ssh -o StrictHostKeyChecking=no root@${TS_IP}"
            echo "   Password: ${ROOT_PASS}"
          fi

      - name: Keep alive until GitHub Actions timeout
        if: success() && env.CONNECTION_STATUS == 'success'
        run: |
          KEEP_ALIVE_HOURS="${{ github.event.inputs.keep_alive_hours }}"
          # Konversi jam ke detik (dikurangi 5 menit untuk safety)
          KEEP_ALIVE_SECONDS=$((KEEP_ALIVE_HOURS * 3600 - 300))
          
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║    🐧 UBUNTU SERVER AKTIF!              ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          echo "🌍 IP Tailscale: $TS_IP"
          echo "👤 User: root"
          echo "🔑 Password: ${{ github.event.inputs.root_password }}"
          echo "⏱️ Durasi: ${KEEP_ALIVE_HOURS} jam"
          echo ""
          echo "💻 SSH Command:"
          echo "ssh -o StrictHostKeyChecking=no root@$TS_IP"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "⏳ Menjaga VPS tetap hidup..."
          echo "═══════════════════════════════════════════"
          
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + KEEP_ALIVE_SECONDS))
          
          # Hitung total menit untuk progress
          TOTAL_MINUTES=$((KEEP_ALIVE_SECONDS / 60))
          CURRENT_MINUTE=0
          
          while true; do
            CURRENT_TIME=$(date +%s)
            REMAINING=$((END_TIME - CURRENT_TIME))
            
            if [ $REMAINING -le 0 ]; then
              echo ""
              echo "═══════════════════════════════════════════"
              echo "⏰ Waktu aktif ${KEEP_ALIVE_HOURS} jam telah habis!"
              echo "Menutup VPS..."
              echo "═══════════════════════════════════════════"
              break
            fi
            
            # Tampilkan progress setiap menit
            CURRENT_MINUTE=$((CURRENT_MINUTE + 1))
            REMAINING_MIN=$((REMAINING / 60))
            REMAINING_HOURS=$((REMAINING_MIN / 60))
            REMAINING_MINS=$((REMAINING_MIN % 60))
            
            # Progress bar sederhana
            PROGRESS=$((CURRENT_MINUTE * 100 / TOTAL_MINUTES))
            BAR_LENGTH=50
            FILLED=$((PROGRESS * BAR_LENGTH / 100))
            EMPTY=$((BAR_LENGTH - FILLED))
            
            # Cetak setiap menit
            printf "\r⏳ ["
            printf "%${FILLED}s" | tr ' ' '='
            printf "%${EMPTY}s" | tr ' ' ' '
            printf "] %3d%% | Sisa: %02d:%02d:%02d   " \
              $PROGRESS \
              $REMAINING_HOURS \
              $((REMAINING_MIN % 60)) \
              $((REMAINING % 60))
            
            # Cek apakah Tailscale masih berjalan
            if ! sudo tailscale status &>/dev/null; then
              echo ""
              echo "❌ Tailscale terputus, mencoba reconnect..."
              TS_AUTH_KEY="${{ github.event.inputs.tailscale_auth_key }}"
              sudo tailscale up --auth-key="${TS_AUTH_KEY}" --hostname="cloudvpss"
              sleep 5
              
              # Update IP jika berubah
              NEW_TS_IP=$(sudo tailscale ip -4)
              if [ -n "$NEW_TS_IP" ] && [ "$NEW_TS_IP" != "$TS_IP" ]; then
                echo "⚠️ IP Tailscale berubah menjadi: ${NEW_TS_IP}"
                echo "TS_IP=${NEW_TS_IP}" >> $GITHUB_ENV
                TS_IP=$NEW_TS_IP
              fi
            fi
            
            sleep 60
          done

      - name: Cleanup
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "Membersihkan koneksi Tailscale..."
          sudo tailscale logout || true
          sudo tailscale down || true
          echo "✅ VPS telah ditutup dan dibersihkan"
          echo "═══════════════════════════════════════════"
